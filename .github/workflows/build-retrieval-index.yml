name: Build Retrieval Index

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-index:
    name: Build and Validate Retrieval Index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-github-actions-role
          aws-region: us-east-1
          role-session-name: indexing-bootstrap-${{ github.run_id }}

      - name: Assume Terraform role
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-terraform-role
          aws-region: us-east-1
          role-chaining: true
          role-session-name: indexing-${{ github.run_id }}

      - name: Resolve indexing infrastructure
        shell: bash
        run: |
          CLUSTER_NAME="agentic-research-rag-indexing-cluster"
          TASK_DEFINITION="agentic-research-rag-indexer"

          VPC_ID="$(aws ec2 describe-vpcs \
            --filters Name=is-default,Values=true \
            --query 'Vpcs[0].VpcId' \
            --output text)"

          SUBNETS="$(aws ec2 describe-subnets \
            --filters Name=vpc-id,Values="${VPC_ID}" \
            --query 'Subnets[].SubnetId' \
            --output text | tr '\t' ',')"

          SECURITY_GROUP="$(aws ec2 describe-security-groups \
            --filters \
              Name=vpc-id,Values="${VPC_ID}" \
              Name=group-name,Values=agentic-research-rag-indexer-sg \
            --query 'SecurityGroups[0].GroupId' \
            --output text)"

          if [ -z "${VPC_ID}" ] || [ "${VPC_ID}" = "None" ]; then
            echo "Could not resolve the default VPC."
            exit 1
          fi

          if [ -z "${SUBNETS}" ] || [ "${SUBNETS}" = "None" ]; then
            echo "Could not resolve indexing subnets."
            exit 1
          fi

          if [ -z "${SECURITY_GROUP}" ] || [ "${SECURITY_GROUP}" = "None" ]; then
            echo "Could not resolve the indexing security group."
            exit 1
          fi

          echo "CLUSTER_NAME=${CLUSTER_NAME}" >> "${GITHUB_ENV}"
          echo "TASK_DEFINITION=${TASK_DEFINITION}" >> "${GITHUB_ENV}"
          echo "SUBNETS=${SUBNETS}" >> "${GITHUB_ENV}"
          echo "SECURITY_GROUP=${SECURITY_GROUP}" >> "${GITHUB_ENV}"

      - name: Run indexing task
        shell: bash
        run: |
          TASK_ARN="$(aws ecs run-task \
            --cluster "${CLUSTER_NAME}" \
            --task-definition "${TASK_DEFINITION}" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "ECS did not return an indexing task ARN."
            exit 1
          fi

          echo "Started indexing task: ${TASK_ARN}"
          echo "TASK_ARN=${TASK_ARN}" >> "${GITHUB_ENV}"

      - name: Wait for indexing task
        shell: bash
        run: |
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}"

      - name: Validate indexing task exit code
        shell: bash
        run: |
          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"

          STOPPED_REASON="$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].stoppedReason' \
            --output text)"

          echo "Exit code: ${EXIT_CODE}"
          echo "Stopped reason: ${STOPPED_REASON}"

          if [ "${EXIT_CODE}" != "0" ]; then
            echo "Indexing task failed."
            exit 1
          fi

      - name: Resolve candidate version
        shell: bash
        run: |
          TASK_ID="${TASK_ARN##*/}"
          LOG_STREAM="indexer/agentic-research-rag-indexer/${TASK_ID}"

          CANDIDATE_VERSION=""

          for ATTEMPT in $(seq 1 12); do
            LOGS="$(aws logs filter-log-events \
              --log-group-name /ecs/agentic-research-rag \
              --log-stream-names "${LOG_STREAM}" \
              --query 'events[*].message' \
              --output text)"

            echo "${LOGS}"

            CANDIDATE_VERSION="$(printf '%s\n' "${LOGS}" \
              | grep -oE 'Version: [0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}' \
              | tail -n 1 \
              | sed 's/^Version: //' || true)"

            if [ -n "${CANDIDATE_VERSION}" ]; then
              break
            fi

            echo "Candidate version not visible yet. Attempt ${ATTEMPT}/12."
            sleep 5
          done

          if [ -z "${CANDIDATE_VERSION}" ]; then
            echo "Could not resolve the candidate version from indexing logs."
            exit 1
          fi

          echo "Candidate version: ${CANDIDATE_VERSION}"
          echo "CANDIDATE_VERSION=${CANDIDATE_VERSION}" >> "${GITHUB_ENV}"

      - name: Run candidate validation task
        shell: bash
        run: |
          OVERRIDES="$(jq -nc \
            --arg version "${CANDIDATE_VERSION}" \
            '{
              containerOverrides: [
                {
                  name: "agentic-research-rag-indexer",
                  command: [
                    "python",
                    "-m",
                    "agentic_research_rag.artifacts.validate_candidate",
                    "--version",
                    $version
                  ]
                }
              ]
            }')"

          VALIDATION_TASK_ARN="$(aws ecs run-task \
            --cluster "${CLUSTER_NAME}" \
            --task-definition "${TASK_DEFINITION}" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' \
            --output text)"

          if [ -z "${VALIDATION_TASK_ARN}" ] || [ "${VALIDATION_TASK_ARN}" = "None" ]; then
            echo "ECS did not return a validation task ARN."
            exit 1
          fi

          echo "Started validation task: ${VALIDATION_TASK_ARN}"
          echo "VALIDATION_TASK_ARN=${VALIDATION_TASK_ARN}" >> "${GITHUB_ENV}"

      - name: Wait for candidate validation
        shell: bash
        run: |
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${VALIDATION_TASK_ARN}"

      - name: Validate candidate task exit code
        shell: bash
        run: |
          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${VALIDATION_TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"

          STOPPED_REASON="$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${VALIDATION_TASK_ARN}" \
            --query 'tasks[0].stoppedReason' \
            --output text)"

          echo "Exit code: ${EXIT_CODE}"
          echo "Stopped reason: ${STOPPED_REASON}"

          if [ "${EXIT_CODE}" != "0" ]; then
            echo "Candidate validation failed."
            exit 1
          fi

      - name: Show validation logs
        if: always() && env.VALIDATION_TASK_ARN != ''
        shell: bash
        run: |
          TASK_ID="${VALIDATION_TASK_ARN##*/}"

          aws logs filter-log-events \
            --log-group-name /ecs/agentic-research-rag \
            --log-stream-names "indexer/agentic-research-rag-indexer/${TASK_ID}" \
            --query 'events[*].message' \
            --output text

      - name: Show validated candidate
        if: success()
        shell: bash
        run: |
          echo "Candidate retrieval index built and validated successfully."
          echo "Version: ${CANDIDATE_VERSION}"
          echo "The candidate has not been promoted."
