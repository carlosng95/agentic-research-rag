name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  aws-oidc:
    name: Validate AWS OIDC and Role Chaining
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Assume GitHub Actions role with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-github-actions-role
          aws-region: us-east-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify GitHub Actions role
        run: aws sts get-caller-identity

      - name: Assume Terraform role
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-terraform-role
          aws-region: us-east-1
          role-chaining: true
          role-session-name: terraform-${{ github.run_id }}

      - name: Verify Terraform role
        run: aws sts get-caller-identity