name: Build and Publish Image

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-image:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-github-actions-role
          aws-region: us-east-1
          role-session-name: manual-build-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/agentic_research_rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name agentic_research_rag \
            --image-ids imageTag="${GITHUB_SHA}"

      - name: Show image tag
        run: echo "Published image tag ${GITHUB_SHA}"