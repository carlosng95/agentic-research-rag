name: CI

"on":
  push:
    branches:
      - main
      - mlops/aws-deployment
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -v

  build-image:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/mlops/aws-deployment'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-github-actions-role
          aws-region: us-east-1
          role-session-name: build-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/agentic_research_rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name agentic_research_rag \
            --image-ids imageTag=${GITHUB_SHA}

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - test
      - build-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/mlops/aws-deployment'

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_container_image_tag: ${{ github.sha }}
      TF_VAR_alb_ingress_cidr: ${{ vars.ALB_INGRESS_CIDR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Terraform variables
        run: |
          if [ -z "${TF_VAR_alb_ingress_cidr}" ]; then
            echo "ALB_INGRESS_CIDR repository variable is not configured."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-github-actions-role
          aws-region: us-east-1
          role-session-name: github-${{ github.run_id }}

      - name: Assume Terraform role
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::649616336579:role/agentic-rag-terraform-role
          aws-region: us-east-1
          role-chaining: true
          role-session-name: terraform-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color -input=false