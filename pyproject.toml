[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "agentic-research-rag"
version = "0.1.0"
description = "General-purpose agentic research assistant with hybrid retrieval, reranking, citations, conversational memory, and web fallback."
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "openai",
    "pypdf",
    "python-dotenv",
    "rank-bm25",
    "sentence-transformers",
]


[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.setuptools.packages.find]
include = ["agentic_research_rag*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]